plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 3]

def nativeDependencyRoot = System.getenv("VENERA_NATIVE_ROOT")
        ?: new File(rootDir, "../.local/comic_translation_native").canonicalPath
def nativeRuntimeRoot = new File(nativeDependencyRoot, "runtime")
def nativeWebpRoot = new File(nativeDependencyRoot, "libwebp")
def nativeCTranslate2Root = new File(nativeRuntimeRoot, "ctranslate2")
def nativeSentencePieceRoot = new File(nativeRuntimeRoot, "sentencepiece")
def nativeLlamaRoot = new File(nativeRuntimeRoot, "llama")
def nativeRuntimeVersion = new File(nativeRuntimeRoot, "versions.json")
def nativeRuntimeRevision = nativeRuntimeVersion.exists()
        ? Integer.toHexString(nativeRuntimeVersion.getText("UTF-8").hashCode())
        : "missing"
def requireLocalTranslationRuntime = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace = "com.github.wgh136.venera"
    compileSdk = flutter.compileSdkVersion
    ndkVersion "28.0.13004108"

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    splits{
        abi {
            reset()
            include 'arm64-v8a'
            enable true
            universalApk true
            }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions{
        jvmTarget = JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            if (keystoreProperties['storeFile']) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
        release {
            if (keystoreProperties['storeFile']) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    defaultConfig {
        applicationId = "com.github.wgh136.venera"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cFlags "-O3"
                abiFilters "arm64-v8a"
                arguments "-DLIBWEBP_PATH=${nativeWebpRoot.canonicalPath}",
                        "-DCTRANSLATE2_ROOT=${nativeCTranslate2Root.canonicalPath}",
                        "-DSENTENCEPIECE_ROOT=${nativeSentencePieceRoot.canonicalPath}",
                        "-DLLAMA_ROOT=${nativeLlamaRoot.canonicalPath}",
                        "-DVENERA_NATIVE_RUNTIME_REVISION=${nativeRuntimeRevision}",
                        "-DVENERA_REQUIRE_LOCAL_TRANSLATION=${requireLocalTranslationRuntime ? "ON" : "OFF"}"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
            signingConfig signingConfigs.release
        }
        debug {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
            signingConfig signingConfigs.debug
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            def buildType = variant.buildType.name

            if (buildType == "release" || buildType == "profile") {
                if (abi != null) {
                    def abiVersionCode = project.ext.abiCodes.get(abi)
                    if (abiVersionCode != null) {
                        //versionCodeOverride = variant.versionCode * 10 + abiVersionCode
                        versionCodeOverride = variant.versionCode * 10
                    }
                } else {
                    versionCodeOverride = variant.versionCode * 10
                }

                // 输出文件名可根据类型区分（避免互相覆盖）
                if (buildType == "release") {
                    outputFileName = "venera-${variant.versionName}-${abi ?: 'universal'}.apk"
                } else { // profile
                    outputFileName = "venera-profile-${variant.versionName}-${abi ?: 'universal'}.apk"
                }
            } else if (buildType == "debug") {
                // versionCodeOverride = variant.versionCode * 10 + 4
                versionCodeOverride = variant.versionCode * 10
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation project(':ppocr-sdk')
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
